sandstorm_instances:
  - name: sandstorm
    dir: sandstorm_server
    cpu: 3
    game_port: 27000
    query_port: 27010
    rcon_port: 27020
    server_name: "[DE] CrazyStorm / ISMC / Balanced AI"
    max_players: 16
    tag: "[1]"
    mutators: [ISMCarmory_Legacy, ISMCJumpShoot]
    env_file: .env
  - name: sandstorm-hardcore
    dir: sandstorm_server_hardcore
    cpu: 2
    game_port: 27100
    query_port: 27110
    rcon_port: 27120
    server_name: "[DE] CrazyStorm / ISMC / Hardcore"
    max_players: 10
    game_mode: CheckpointHardcore
    tag: "[2]"
    mutators: [ISMCarmory_Legacy, ISMCJumpShoot, Hardcore]
    env_file: .env.sandstorm-hardcore

sandstorm_instance_secrets:
  sandstorm:
    rcon_password: "{{ sandstorm_rcon_password }}"
    gslt_token: "{{ sandstorm_gslt_token }}"
    gamestats_token: "{{ sandstorm_gamestats_token }}"
  sandstorm-hardcore:
    rcon_password: "{{ vault_sandstorm_hardcore_rcon_password }}"
    gslt_token: "{{ vault_sandstorm_hardcore_gslt_token }}"
    gamestats_token: "{{ vault_sandstorm_hardcore_gamestats_token }}"
